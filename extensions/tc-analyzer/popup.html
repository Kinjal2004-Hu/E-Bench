<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=300">
  <title>T&C Analyzer</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { margin: 0; padding: 0; width: 300px; }
    .container { padding: 12px; }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .logo-icon { font-size: 20px; }
    .header span { font-size: 14px; font-weight: 600; }
    p { font-size: 12px; color: #666; margin: 8px 0; }
    small { font-size: 10px; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <span class="logo-icon">⚖️</span>
      <span>T&C Analyzer</span>
    </div>
    <p>Automatically analyzes Terms & Conditions on any page.</p>
    <small>Visit a T&C page to see analysis.</small>
  </div>
</body>
</html>
