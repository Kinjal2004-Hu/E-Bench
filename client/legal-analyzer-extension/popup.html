<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Bench Legal Analyzer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 420px;
      height: 550px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #2a2a4e;
      flex-shrink: 0;
    }
    .logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo svg {
      width: 22px;
      height: 22px;
    }
    .title-info {
      flex: 1;
    }
    .title {
      font-size: 15px;
      font-weight: 600;
    }
    .subtitle {
      font-size: 11px;
      color: #888;
    }
    .preview-section {
      padding: 12px 16px;
      border-bottom: 1px solid #2a2a4e;
      flex-shrink: 0;
    }
    .preview-img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      display: none;
    }
    .preview-img.visible {
      display: block;
    }
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .messages::-webkit-scrollbar {
      width: 5px;
    }
    .messages::-webkit-scrollbar-thumb {
      background: #e94560;
      border-radius: 3px;
    }
    .message {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.5;
      max-width: 90%;
      word-wrap: break-word;
    }
    .message.user {
      background: #e94560;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .message.ai {
      background: #2a2a4e;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .message.system {
      background: transparent;
      color: #888;
      font-size: 12px;
      text-align: center;
      align-self: center;
    }
    .input-area {
      padding: 12px 16px;
      border-top: 1px solid #2a2a4e;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #2a2a4e;
      border-radius: 20px;
      background: #1a1a2e;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    .input-area input:focus {
      border-color: #e94560;
    }
    .input-area button {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #e94560 0%, #c73e54 100%);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }
    .input-area button:hover {
      transform: scale(1.05);
    }
    .input-area button:disabled {
      background: #444;
      cursor: not-allowed;
    }
    .loading {
      display: none;
      text-align: center;
      padding: 10px;
      color: #e94560;
      font-size: 12px;
    }
    .loading.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="14" stroke="white" stroke-width="3"/>
        <line x1="28" y1="28" x2="44" y2="44" stroke="white" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="title-info">
      <div class="title">E-Bench Legal AI</div>
      <div class="subtitle">AI-powered page analysis</div>
    </div>
  </div>

  <div class="preview-section">
    <img id="previewImg" class="preview-img" alt="Screenshot">
  </div>

  <div class="chat-container">
    <div class="messages" id="messages">
      <div class="message system">Click the floating button to capture & analyze any page</div>
    </div>
    <div class="loading" id="loading">Analyzing with AI...</div>
  </div>

  <div class="input-area">
    <input type="text" id="userInput" placeholder="Ask about this page...">
    <button id="sendBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="22" y1="2" x2="11" y2="13"></line>
        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
      </svg>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
